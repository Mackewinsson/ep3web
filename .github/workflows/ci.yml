name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: Core workflow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ep3
          POSTGRES_PASSWORD: ep3
          POSTGRES_DB: ep3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ep3 -d ep3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ep3:ep3@localhost:5432/ep3
      DATABASE_DRIVER: pg
      JWT_SECRET: ci-jwt-secret-not-for-production
      ADMIN_EMAIL: admin@test.cl
      ADMIN_PASSWORD: ep3admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/prepare-database.mjs
      - run: npm run build
      - run: npm run test:e2e
